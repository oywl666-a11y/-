<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>滤波器实验室 · RC Filter Studio</title>
<style>
:root{--bg:#f3f4f1;--paper:#fff;--ink:#18231f;--muted:#738078;--line:#e4e9e5;--green:#24785c;--green2:#dff2e9;--orange:#d57b44;--orange2:#fff0e5;--blue:#597baf;--blue2:#eaf0fa;--shadow:0 10px 36px #18231f0b;--mono:'DM Mono',monospace;--sans:'DM Sans','Noto Sans SC',sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px}button,input{font:inherit}.shell{max-width:1440px;margin:auto;padding:28px 36px 44px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}.brand{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:-.3px}.brandmark{width:36px;height:36px;border-radius:11px;background:#1d4034;color:#d6efdf;display:grid;place-items:center;font-family:var(--mono);font-size:14px}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500;letter-spacing:.2px;margin-top:2px}.topnote{color:var(--muted);font-size:12px}.hero{display:flex;justify-content:space-between;align-items:end;margin:0 0 22px}.eyebrow{font:11px var(--mono);letter-spacing:1.5px;color:var(--green);text-transform:uppercase;margin-bottom:9px}.hero h1{font-size:30px;letter-spacing:-1px;margin:0;font-weight:700}.hero p{color:var(--muted);margin:8px 0 0;font-size:13px}.live{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:8px 12px;color:#56645c;font-size:11px}.dot{width:7px;height:7px;border-radius:50%;background:#54a37b;box-shadow:0 0 0 3px #54a37b20}.tabs{display:flex;gap:7px;margin-bottom:18px}.tab{border:1px solid transparent;background:transparent;color:#69766e;padding:10px 16px;border-radius:9px;cursor:pointer;font-weight:600}.tab:hover{background:#e9ede9}.tab.active{background:#1e4739;color:white;box-shadow:0 4px 12px #173c3030}.tab span{font:10px var(--mono);opacity:.7;margin-left:7px}.layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(360px,.9fr);gap:16px;align-items:start}.leftcol,.rightcol{display:grid;gap:16px}.card{background:var(--paper);border:1px solid #e9ede9;border-radius:14px;box-shadow:var(--shadow)}.cardhead{padding:17px 20px 13px;display:flex;align-items:center;justify-content:space-between}.cardtitle{font-size:13px;font-weight:700;display:flex;align-items:center;gap:9px}.step{font:10px var(--mono);color:#87948c;background:#f1f4f1;border-radius:5px;padding:4px 6px}.subtle{color:var(--muted);font-size:11px}.circuitwrap{padding:5px 18px 17px}.circuit{width:100%;height:auto;display:block;min-height:230px}.wire{stroke:#66776e;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.node{fill:#fff;stroke:#31493f;stroke-width:2}.ground{stroke:#7a8981;stroke-width:1.7}.component{fill:#f6faf7;stroke:#43836a;stroke-width:2}.component.orange{fill:#fff7f0;stroke:#d28a59}.component.blue{fill:#f2f6ff;stroke:#7391c0}.label{font:12px var(--mono);fill:#52645b}.value{font:12px var(--mono);font-weight:500;fill:#1e4938}.signal{stroke:#4b9a76;stroke-width:2;fill:none;stroke-dasharray:5 6;animation:flow 1.3s linear infinite}@keyframes flow{to{stroke-dashoffset:-22}}.chartpad{padding:0 14px 9px}.chart{width:100%;height:auto;display:block;overflow:visible}.gridline{stroke:#e9eeea;stroke-width:1}.axis{stroke:#bbc6bf;stroke-width:1}.chartlabel{font:10px var(--mono);fill:#87938d}.curve{fill:none;stroke:#267859;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.cutline{stroke:#d5824e;stroke-width:1;stroke-dasharray:4 4;opacity:.8}.peakdot{fill:#fff;stroke:#267859;stroke-width:3}.legend{display:flex;gap:18px;padding:0 19px 15px;color:#69776f;font-size:10px}.legend i{display:inline-block;width:14px;border-top:2px solid #267859;vertical-align:middle;margin-right:6px}.legend i.dashed{border-color:#d5824e;border-top-style:dashed}.controls{padding:0 20px 20px}.control{padding:12px 0 14px;border-top:1px solid #eff2ef}.control:first-child{border-top:0}.controltop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.controlname{font-weight:600;font-size:12px}.controlname em{font:10px var(--mono);color:#89968e;font-style:normal;margin-left:6px}.edit{display:flex;align-items:center;gap:6px}.edit input{width:90px;text-align:right;border:1px solid #e5eae6;background:#fafbfa;border-radius:6px;padding:6px 7px;color:#20372c;font:12px var(--mono);outline:none}.edit input:focus{border-color:#68a486;box-shadow:0 0 0 3px #dff2e9}.unit{font:10px var(--mono);color:#7d8982;min-width:22px}.range{width:100%;height:4px;accent-color:#367d60;cursor:pointer}.range::-webkit-slider-thumb{cursor:grab}.controlhint{display:flex;justify-content:space-between;color:#a1aaa4;font:9px var(--mono);margin-top:3px}.resulthead{padding:18px 20px 10px}.resultgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:2px 16px 17px}.metric{background:#f6f8f6;border-radius:10px;padding:12px 13px;min-height:77px}.metric.primary{background:#eaf5ef}.metriclabel{font-size:10px;color:#78847d;margin-bottom:7px}.metricval{font:19px var(--mono);letter-spacing:-.7px;color:#203d30}.metricunit{font-size:10px;color:#7c8981;margin-left:4px}.equation{margin:0 16px 16px;padding:12px 14px;border-radius:9px;background:#f7f8f7;color:#56645b;font:11px/1.75 var(--mono);overflow-wrap:anywhere}.equation b{color:#315c47;font-weight:500}.note{font-size:10px;color:#808d85;padding:0 18px 16px;line-height:1.6}.chip{font:10px var(--mono);border-radius:5px;padding:5px 7px;background:#f1f4f2;color:#6d7b72}.footer{padding:23px 2px 0;display:flex;justify-content:space-between;color:#89948d;font-size:10px}.hintbox{margin:0 16px 16px;border-left:2px solid #68a486;padding:2px 0 2px 10px;font-size:10px;line-height:1.7;color:#718078}.hidden{display:none!important}
@media(max-width:900px){.shell{padding:20px}.layout{grid-template-columns:1fr}.hero h1{font-size:26px}.rightcol{grid-row:1}.topnote{display:none}}@media(max-width:540px){.shell{padding:15px}.hero{align-items:start}.hero h1{font-size:23px}.live{font-size:0;padding:10px}.tabs{overflow:auto}.tab{white-space:nowrap;padding:9px 12px}.cardhead{padding-left:15px;padding-right:15px}.circuitwrap{padding-left:7px;padding-right:7px}.resultgrid{padding-left:12px;padding-right:12px}.metricval{font-size:16px}}
</style>
</head>
<body>
<main class="shell">
<header class="topbar"><div class="brand"><div class="brandmark">R·C</div><div>滤波器实验室<small>PASSIVE FILTER EXPLORER</small></div></div><div class="topnote">交互式电路与频率响应可视化</div></header>
<section class="hero"><div><div class="eyebrow">LEARN BY TUNING</div><h1>看见频率，听见电路</h1><p>调整电阻与电容，观察 RC 滤波器如何改变信号。</p></div><div class="live"><i class="dot"></i> 实时计算</div></section>
<nav class="tabs" aria-label="选择滤波器"><button class="tab active" data-mode="hp">高通 <span>HPF</span></button><button class="tab" data-mode="lp">低通 <span>LPF</span></button><button class="tab" data-mode="bp">带通 <span>BPF</span></button></nav>
<section class="layout"><div class="leftcol">
<article class="card"><div class="cardhead"><div class="cardtitle"><span class="step">01</span> 电路结构</div><span class="chip" id="topology">一阶 RC · 无源</span></div><div class="circuitwrap" id="circuit"></div></article>
<article class="card"><div class="cardhead"><div class="cardtitle"><span class="step">02</span> 幅频响应</div><span class="subtle">幅度 / dB · 对数频率轴</span></div><div class="chartpad"><svg class="chart" id="chart" viewBox="0 0 680 280" role="img" aria-label="滤波器幅频响应图"></svg></div><div class="legend"><span><i></i>理论响应</span><span><i class="dashed"></i>截止频率（−3 dB）</span></div></article>
</div><div class="rightcol">
<article class="card"><div class="cardhead"><div class="cardtitle"><span class="step">03</span> 元件参数</div><button id="reset" class="chip" style="border:0;cursor:pointer">恢复默认</button></div><div class="controls" id="controls"></div></article>
<article class="card"><div class="resulthead"><div class="cardtitle"><span class="step">04</span> 计算结果</div></div><div class="resultgrid" id="results"></div><div class="equation" id="equation"></div><div class="hintbox" id="hint"></div></article>
</div></section>
<footer class="footer"><span>理想电压源 · 输出高阻 · 元件按理想值计算</span><span>RC FILTER STUDIO&nbsp; / &nbsp;01</span></footer>
</main>
<script>
const defaults={hp:{R:10000,C:1e-7},lp:{R:10000,C:1e-7},bp:{R1:10000,C1:1e-7,R2:10000,C2:1e-7}};
let values=JSON.parse(JSON.stringify(defaults)),mode='hp';
const defs={R:{name:'电阻 R',symbol:'R',unit:'Ω',min:100,max:1000000,log:true},C:{name:'电容 C',symbol:'C',unit:'F',min:1e-9,max:1e-3,log:true},R1:{name:'高通电阻',symbol:'R₁',unit:'Ω',min:100,max:1000000,log:true},C1:{name:'耦合电容',symbol:'C₁',unit:'F',min:1e-9,max:1e-3,log:true},R2:{name:'低通电阻',symbol:'R₂',unit:'Ω',min:100,max:1000000,log:true},C2:{name:'滤波电容',symbol:'C₂',unit:'F',min:1e-9,max:1e-3,log:true}};
const $=id=>document.getElementById(id), clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
function pretty(v,kind){if(kind==='R'){if(v>=1e6)return [fmt(v/1e6),'MΩ'];if(v>=1e3)return [fmt(v/1e3),'kΩ'];return [fmt(v),'Ω']}if(v>=1e-3)return [fmt(v*1e3),'mF'];if(v>=1e-6)return [fmt(v*1e6),'µF'];if(v>=1e-9)return [fmt(v*1e9),'nF'];return [fmt(v),'F']}
function fmt(v){if(!isFinite(v))return '—';if(Math.abs(v)>=1000)return v.toFixed(0);if(v>=100)return v.toFixed(1).replace(/\.0$/,'');if(v>=10)return v.toFixed(2).replace(/0+$/,'').replace(/\.$/,'');if(v>=1)return v.toFixed(3).replace(/0+$/,'').replace(/\.$/,'');return v.toPrecision(3)}
function eng(v){if(v>=1e6)return fmt(v/1e6)+' MHz';if(v>=1e3)return fmt(v/1e3)+' kHz';if(v>=1)return fmt(v)+' Hz';if(v>=1e-3)return fmt(v*1e3)+' mHz';return fmt(v*1e6)+' µHz'}
function parseValue(text,kind,displayUnit){let s=text.trim().replace(/,/g,'').replace(/Ω|ohm/ig,'').replace(/µ|μ/g,'u');let m=s.match(/^([\d.]+)\s*([a-z]*)$/i);if(!m)return NaN;let n=Number(m[1]),u=(m[2]||displayUnit).toLowerCase();if(!isFinite(n)||n<=0)return NaN;if(kind==='R'){let mult=u.startsWith('m')?1e6:u.startsWith('k')?1e3:1;return n*mult}let mult=u.startsWith('m')?1e-3:u.startsWith('u')?1e-6:u.startsWith('n')?1e-9:u.startsWith('p')?1e-12:1;return n*mult}
function controls(){let keys=mode==='bp'?['R1','C1','R2','C2']:['R','C'];$('controls').innerHTML=keys.map(k=>{let d=defs[k],v=values[mode][k],[num,unit]=pretty(v,k[0]);let lo=Math.log10(d.min),hi=Math.log10(d.max),pos=(Math.log10(v)-lo)/(hi-lo)*100;return `<div class="control"><div class="controltop"><div class="controlname">${d.name}<em>${d.symbol}</em></div><div class="edit"><input aria-label="${d.name}" data-input="${k}" value="${num}" inputmode="decimal"><span class="unit" data-unit="${k}">${unit}</span></div></div><input class="range" type="range" min="${lo}" max="${hi}" step="0.001" value="${Math.log10(v)}" data-range="${k}" style="--p:${pos}%"><div class="controlhint"><span>${pretty(d.min,k).join('')}</span><span>${pretty(d.max,k).join('')}</span></div></div>`}).join('');
$('controls').querySelectorAll('[data-range]').forEach(el=>el.addEventListener('input',()=>{let k=el.dataset.range;values[mode][k]=10**Number(el.value);update()}));$('controls').querySelectorAll('[data-input]').forEach(el=>{el.addEventListener('change',()=>{let k=el.dataset.input,unit=el.parentElement.querySelector('.unit').textContent,v=parseValue(el.value,k[0],unit);if(!isFinite(v))v=values[mode][k];let d=defs[k];values[mode][k]=clamp(v,d.min,d.max);update()});el.addEventListener('keydown',e=>{if(e.key==='Enter')el.blur()})})}
function circuitSVG(){if(mode==='hp')return `<svg class="circuit" viewBox="0 0 680 260" aria-label="RC 高通滤波器电路"><path class="wire" d="M48 110H142 M210 110H315 M315 110V180 M315 180V194 M315 218V230 M315 230H520"/><path class="wire" d="M48 110V230H315"/><path class="component orange" d="M142 110v-7l8-7 10 14 10-14 10 14 10-14 10 7v7"/><path class="wire" d="M315 180v14m-15 0h30m-30 10h30m-15 0v14"/><circle class="node" cx="315" cy="110" r="4"/><path class="ground" d="M315 230v8m-13 0h26m-20 6h14m-9 6h4"/><path class="signal" d="M64 92H132"/><text class="label" x="47" y="94">Vin</text><text class="label" x="526" y="234">GND</text><text class="value" x="163" y="82">R = ${pretty(values.hp.R,'R').join(' ')}</text><text class="value" x="337" y="201">C = ${pretty(values.hp.C,'C').join(' ')}</text><text class="label" x="331" y="102">Vout</text><text class="label" x="328" y="147">取样点</text></svg>`;
if(mode==='lp')return `<svg class="circuit" viewBox="0 0 680 260" aria-label="RC 低通滤波器电路"><path class="wire" d="M48 110H142 M210 110H315 M315 110H520 M315 110V180 M315 218V230 M315 230H520"/><path class="component blue" d="M142 110l7-8 7 8 7-8 7 8 7-8 7 8 7-8 7 8"/><path class="wire" d="M315 180v14m-15 0h30m-30 10h30m-15 0v14"/><circle class="node" cx="315" cy="110" r="4"/><path class="ground" d="M315 230v8m-13 0h26m-20 6h14m-9 6h4"/><path class="signal" d="M64 92H132"/><text class="label" x="47" y="94">Vin</text><text class="value" x="163" y="82">R = ${pretty(values.lp.R,'R').join(' ')}</text><text class="value" x="337" y="201">C = ${pretty(values.lp.C,'C').join(' ')}</text><text class="label" x="526" y="102">Vout</text><text class="label" x="328" y="147">取样点</text><text class="label" x="526" y="234">GND</text></svg>`;
return `<svg class="circuit" viewBox="0 0 680 300" aria-label="RC 带通滤波器电路"><path class="wire" d="M38 116H118 M186 116H282 M282 116H392 M460 116H552 M552 116H626 M282 116V192 M552 116V192 M282 228V250 M552 228V250 M282 250H552"/><path class="component orange" d="M118 116v-7l8-7 10 14 10-14 10 14 10-14 10 7v7"/><path class="component blue" d="M392 116l7-8 7 8 7-8 7 8 7-8 7 8 7-8 7 8"/><path class="wire" d="M282 192v14m-15 0h30m-30 10h30m-15 0v12 M552 192v14m-15 0h30m-30 10h30m-15 0v12"/><circle class="node" cx="282" cy="116" r="4"/><circle class="node" cx="552" cy="116" r="4"/><path class="ground" d="M282 250v8m-13 0h26m-20 6h14m-9 6h4 M552 250v8m-13 0h26m-20 6h14m-9 6h4"/><path class="signal" d="M50 98H108"/><text class="label" x="36" y="91">Vin</text><text class="value" x="126" y="80">R₁ ${pretty(values.bp.R1,'R').join(' ')}</text><text class="value" x="291" y="217">C₁ ${pretty(values.bp.C1,'C').join(' ')}</text><text class="value" x="394" y="80">R₂ ${pretty(values.bp.R2,'R').join(' ')}</text><text class="value" x="559" y="217">C₂ ${pretty(values.bp.C2,'C').join(' ')}</text><text class="label" x="287" y="107">A</text><text class="label" x="557" y="107">Vout</text><text class="label" x="299" y="291">GND</text><text class="label" x="568" y="291">GND</text></svg>`}
function calc(){if(mode==='hp'||mode==='lp'){let {R,C}=values[mode],fc=1/(2*Math.PI*R*C);return {fc,peak:1,params:{R,C},response:f=>{let x=f/fc;return mode==='hp'?x/Math.sqrt(1+x*x):1/Math.sqrt(1+x*x)}}}let {R1,C1,R2,C2}=values.bp,a=R1*C1,b=R2*C2,T=a+b+R1*C2,w0=1/Math.sqrt(a*b),gamma=T/(a*b),Q=w0/gamma,root=Math.sqrt(gamma*gamma+4*w0*w0),wL=(root-gamma)/2,wH=(root+gamma)/2,peak=a/T;return {f0:w0/(2*Math.PI),fL:wL/(2*Math.PI),fH:wH/(2*Math.PI),bw:gamma/(2*Math.PI),Q,peak,params:{R1,C1,R2,C2,a,b,T,w0,gamma},response:f=>{let w=2*Math.PI*f;return (w*a)/Math.sqrt((1-w*w*a*b)**2+(w*T)**2)}}}
function metrics(c){if(mode==='hp'||mode==='lp'){return mode==='hp'?[['截止频率',eng(c.fc),'−3 dB 点','primary'],['时间常数',fmt(c.params.R*c.params.C*1e3),'ms',''],['通带增益',fmt(1),'V/V',''],['滤波阶数','1','阶','']]:[['截止频率',eng(c.fc),'−3 dB 点','primary'],['时间常数',fmt(c.params.R*c.params.C*1e3),'ms',''],['通带增益',fmt(1),'V/V',''],['滤波阶数','1','阶','']]}return [['下截止频率',eng(c.fL),'−3 dB 点','primary'],['上截止频率',eng(c.fH),'−3 dB 点','primary'],['中心频率',eng(c.f0),'√(fL·fH)',''],['带宽',eng(c.bw),'fH − fL',''],['品质因数 Q',fmt(c.Q),'f0 / BW',''],['峰值增益',fmt(c.peak),'V/V','']]}
function renderMetrics(c){$('results').innerHTML=metrics(c).map(([n,v,u,p])=>`<div class="metric ${p}"><div class="metriclabel">${n}</div><div class="metricval">${v}<span class="metricunit">${u}</span></div></div>`).join('');if(mode==='hp'){$('equation').innerHTML='<b>H(s)</b> = sRC / (1 + sRC)<br><b>f<sub>c</sub></b> = 1 / (2πRC)&nbsp;&nbsp; · &nbsp;&nbsp;|H(fc)| = 0.707'}else if(mode==='lp'){$('equation').innerHTML='<b>H(s)</b> = 1 / (1 + sRC)<br><b>f<sub>c</sub></b> = 1 / (2πRC)&nbsp;&nbsp; · &nbsp;&nbsp;|H(fc)| = 0.707'}else{$('equation').innerHTML=`<b>H(s)</b> = sR₁C₁ / [1 + sT + s²R₁R₂C₁C₂]<br><b>T</b> = R₁C₁ + R₂C₂ + R₁C₂<br><b>Q</b> = √(R₁C₁R₂C₂) / T`}if(mode==='bp')$('hint').innerHTML='直接级联时两级会互相加载，公式包含 R₁C₂。截止点按整体峰值的 −3 dB 计算；若级间加电压跟随器，可移除该交互项。';else $('hint').innerHTML=mode==='hp'?'低于截止频率的信号被衰减；频率越高，输出越接近输入。':'高于截止频率的信号被衰减；频率越低，输出越接近输入。'}
function drawChart(c){let svg=$('chart'),W=680,H=280,L=60,R=18,T=18,B=37,pw=W-L-R,ph=H-T-B;let freqs=[];if(mode==='bp')freqs=[c.fL,c.fH];else freqs=[c.fc];let center=mode==='bp'?c.f0:c.fc,minF=Math.max(1e-5,center/1000),maxF=center*1000;if(mode==='bp'){minF=Math.min(minF,c.fL/30);maxF=Math.max(maxF,c.fH*30)}let lo=Math.log10(minF),hi=Math.log10(maxF),ymin=-60,ymax=4,x=f=>L+(Math.log10(f)-lo)/(hi-lo)*pw,y=db=>T+(ymax-db)/(ymax-ymin)*ph;let path='';let maxMag=0,peakF=minF;for(let i=0;i<=500;i++){let f=10**(lo+(hi-lo)*i/500),m=Math.max(1e-10,c.response(f));if(m>maxMag){maxMag=m;peakF=f}let db=Math.max(ymin,20*Math.log10(m));path+=(i?'L':'M')+x(f).toFixed(2)+' '+y(db).toFixed(2)+' '}let ticks=[0,-3,-6,-12,-20,-40,-60];let horizontal=ticks.map(t=>`<line class="gridline" x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}"/><text class="chartlabel" x="${L-10}" y="${y(t)+3}" text-anchor="end">${t}</text>`).join('');let xt=Array.from({length:7},(_,i)=>{let f=10**(lo+(hi-lo)*i/6);return `<line class="gridline" x1="${x(f)}" x2="${x(f)}" y1="${T}" y2="${H-B}"/><text class="chartlabel" x="${x(f)}" y="${H-14}" text-anchor="middle">${eng(f)}</text>`}).join('');let cutlines=freqs.map(f=>x(f)>L&&x(f)<W-R?`<line class="cutline" x1="${x(f)}" x2="${x(f)}" y1="${T}" y2="${H-B}"/>`:'' ).join('');let pkx=x(peakF),pky=y(20*Math.log10(maxMag));svg.innerHTML=`${horizontal}${xt}<line class="axis" x1="${L}" x2="${L}" y1="${T}" y2="${H-B}"/><line class="axis" x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}"/>${cutlines}<path class="curve" d="${path}"/><circle class="peakdot" cx="${pkx}" cy="${pky}" r="5"/><text class="chartlabel" x="${L}" y="12">增益 / dB</text><text class="chartlabel" x="${W-R}" y="${H-1}" text-anchor="end">频率</text>`}
function update(){let c=calc();controls();$('circuit').innerHTML=circuitSVG();$('topology').textContent=mode==='bp'?'二阶 RC · 直接级联':'一阶 RC · 无源';renderMetrics(c);drawChart(c)}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===b));update()}));$('reset').addEventListener('click',()=>{values[mode]=JSON.parse(JSON.stringify(defaults[mode]));update()});update();
</script>
